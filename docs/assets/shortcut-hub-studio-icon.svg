<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Shortcut Hub Studio icon</title>
  <desc id="desc">A dark rounded square with a local dashboard symbol and shortcut arrow.</desc>
  <defs>
    <linearGradient id="base" x1="30" x2="210" y1="20" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101a37"/>
      <stop offset="0.55" stop-color="#172343"/>
      <stop offset="1" stop-color="#1d2542"/>
    </linearGradient>
    <linearGradient id="cyan" x1="58" x2="168" y1="62" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20f2dd"/>
      <stop offset="1" stop-color="#12c7ea"/>
    </linearGradient>
    <linearGradient id="violet" x1="72" x2="160" y1="80" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13d8e0"/>
      <stop offset="1" stop-color="#965ff8"/>
    </linearGradient>
    <linearGradient id="arrow" x1="146" x2="204" y1="144" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#278cff"/>
      <stop offset="1" stop-color="#2f69f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="228" height="228" x="6" y="6" rx="54" fill="url(#base)"/>
  <rect width="228" height="228" x="6" y="6" rx="54" fill="none" stroke="#5772b2" stroke-width="4"/>
  <rect width="126" height="96" x="51" y="64" rx="18" fill="none" stroke="url(#cyan)" stroke-width="5"/>
  <rect width="28" height="28" x="75" y="89" rx="6" fill="#18d9df"/>
  <rect width="28" height="28" x="109" y="89" rx="6" fill="url(#violet)"/>
  <rect width="84" height="5" x="77" y="142" rx="3" fill="#8c5cf4"/>
  <g filter="url(#shadow)">
    <rect width="65" height="65" x="140" y="140" rx="17" fill="#f7fbff"/>
    <rect width="65" height="65" x="140" y="140" rx="17" fill="none" stroke="#6a86bd" stroke-width="4"/>
    <path d="M164 183 187 160m0 0h-23m23 0v23" fill="none" stroke="url(#arrow)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
